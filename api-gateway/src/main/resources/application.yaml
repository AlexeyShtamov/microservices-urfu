spring:
  application:
    name: api-gateway
  redis:
    host: localhost
    port: 6379

services:
  user-service-url: http://localhost:8081
  order-service-url: http://localhost:8082
  product-service-url: http://localhost:8083

cache:
  ttl-seconds: 30

rate-limit:
  requests: 30
  window-seconds: 60

security:
  jwt:
    secret: change-me

logging:
  level:
    root: INFO
    ru.shtamov.apigateway: DEBUG
